version: '3.8'

services:
  wsi-viewer:
    build: .
    container_name: wsi-viewer
    ports:
      - "8511:8511"
    volumes:
      # Mount local slides directory (optional)
      - ./uploads:/app/uploads
      # Mount local overlays directory (optional)
      - ./overlays:/app/overlays
      # Mount GCS credentials (optional, for private buckets)
      # - ~/.config/gcloud:/root/.config/gcloud:ro
    environment:
      # Container listens on PORT (Cloud Run uses 8080; local default 8511)
      - PORT=8511
      # Optional: Set GCS service account path for private buckets
      # - GCS_SERVICE_ACCOUNT_PATH=/app/gcs-key.json
      # Session TTL in minutes
      - SESSION_TTL=30
    # Override slide paths via env (optional):
    # - SLIDE_PATHS=gs://bucket/path/,https://storage.googleapis.com/bucket/slide.svs
    # - OVERLAY_PATHS=/app/overlays
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from urllib.request import urlopen; port=os.environ.get('PORT','8080'); urlopen(f'http://localhost:{port}/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
