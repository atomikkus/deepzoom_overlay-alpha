<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSI Viewer</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- OpenSeadragon & Plugins -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/geotiff-tilesource@latest/dist/geotiff-tilesource.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1 class="logo">
                <span class="logo-icon">🔬</span>
                WSI Viewer
            </h1>
            <div class="header-info">
                <span id="slide-count" class="badge">0 slides</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Slides List -->
            <div class="sidebar-section">
                <h2 class="section-title">Available Slides</h2>
                <div class="slides-list" id="slides-list">
                    <p class="empty-state">No slides found in slides directory</p>
                </div>
            </div>

            <!-- Density Opacity Control (Global) -->
            <div class="sidebar-section" id="density-opacity-section" style="display: none;">
                <h2 class="section-title">Density Overlay</h2>
                <div style="padding: 0 0.5rem;">
                    <label for="density-opacity" style="font-size: 0.875rem; color: var(--text-muted);">
                        Opacity: <span id="density-opacity-value">60</span>%
                    </label>
                    <input type="range" id="density-opacity" min="10" max="100" value="60"
                        style="width: 100%; margin-top: 0.25rem;" oninput="updateDensityOpacity(this.value)">
                </div>
            </div>
        </aside>

        <!-- Viewer Area -->
        <main class="viewer-area">
            <!-- Controls -->
            <div class="controls-panel">
                <button class="control-btn" id="zoom-in-btn" title="Zoom In">
                    <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="11" y1="8" x2="11" y2="14"></line>
                        <line x1="8" y1="11" x2="14" y2="11"></line>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
                <button class="control-btn" id="zoom-out-btn" title="Zoom Out">
                    <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="8" y1="11" x2="14" y2="11"></line>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
                <button class="control-btn" id="draw-polygon-btn" title="Draw Polygon">
                    <svg class="control-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none" xmlns="http://www.w3.org/2000/svg">
                        <g transform="translate(12, 12) scale(1.48) translate(-18, -18)">

52 15.0341 23.0901 14.9483 22.9851 14.8395C22.8802 14.7306 22.7975 14.601 22.7421 14.4583C22.6866 14.3155 22.6596 14.1627 22.6626 14.0089C22.6656 13.8551 22.6985 13.7035 22.7594 13.5632C22.8203 13.4229 22.9079 13.2967 23.017 13.1924C23.2239 12.978 23.5045 12.8576 23.7971 12.8576C24.0898 12.8576 24.3704 12.978 24.5773 13.1924C24.7842 13.4067 24.9004 13.6974 24.9004 14.0005C24.9004 14.3036 24.7842 14.5943 24.5773 14.8086L24.5752 14.8079Z"/>
                        </g>
                    </svg>
                </button>
                <button class="control-btn" id="label-polygon-btn" title="Add Labels">
                    <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                        <line x1="7" y1="7" x2="7.01" y2="7"></line>
                    </svg>
                </button>
                <button class="control-btn" id="measure-btn" title="Measure Distance">
                    <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <!-- L-shaped ruler body: top horizontal bar + left vertical bar -->
                        <path d="M2 2 H22 V10 H10 V22 H2 Z"></path>
                        <!-- tick marks on top edge (inside horizontal bar) -->
                        <line x1="6"  y1="2" x2="6"  y2="5"></line>
                        <line x1="10" y1="2" x2="10" y2="6.5"></line>
                        <line x1="14" y1="2" x2="14" y2="5"></line>
                        <line x1="18" y1="2" x2="18" y2="5"></line>
                        <!-- tick marks on left edge (inside vertical bar) -->
                        <line x1="2" y1="6"  x2="5"   y2="6"></line>
                        <line x1="2" y1="10" x2="6.5" y2="10"></line>
                        <line x1="2" y1="14" x2="5"   y2="14"></line>
                        <line x1="2" y1="18" x2="5"   y2="18"></line>
                    </svg>
                </button>
                <button class="control-btn" id="fullscreen-btn" title="Fullscreen">
                    <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    </svg>
                </button>
                <button class="control-btn" id="snapshot-btn" title="Take Snapshot">
                    <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.52" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                        <g transform="translate(12, 12) scale(1.32) translate(-18, -18)">
                            <path d="M16.1579 24.5579V19.3955C16.1579 19.2782 16.2045 19.1657 16.2874 19.0828C16.3703 18.9999 16.4827 18.9533 16.6 18.9533H17.4643C17.5382 18.9533 17.6109 18.9347 17.6758 18.8993C17.7407 18.8639 17.7956 18.8128 17.8357 18.7507L18.9011 17.0972C18.9412 17.035 18.9961 16.9839 19.061 16.9485C19.1259 16.9131 19.1986 16.8946 19.2725 16.8945H21.8853C21.9593 16.8946 22.032 16.9131 22.0968 16.9485C22.1617 16.9839 22.2167 17.035 22.2567 17.0972L23.3222 18.7507C23.3622 18.8128 23.4172 18.8639 23.4821 18.8993C23.5469 18.9347 23.6196 18.9533 23.6936 18.9533H24.5579C24.6159 18.9533 24.6734 18.9648 24.727 18.987C24.7807 19.0092 24.8294 19.0418 24.8705 19.0828C24.9115 19.1239 24.9441 19.1726 24.9663 19.2263C24.9885 19.2799 25 19.3374 25 19.3955V24.5579C25 24.616 24.9885 24.6735 24.9663 24.7271C24.9441 24.7808 24.9115 24.8295 24.8705 24.8706C24.8294 24.9116 24.7807 24.9442 24.727 24.9664C24.6734 24.9886 24.6159 25 24.5579 25H16.6C16.5419 25 16.4845 24.9886 16.4308 24.9664C16.3772 24.9442 16.3284 24.9116 16.2874 24.8706C16.2463 24.8295 16.2138 24.7808 16.1916 24.7271C16.1693 24.6735 16.1579 24.616 16.1579 24.5579Z"/>
                            <path d="M11 22.053V24.2636H12.8421M11 15.7896V19.4739M11 13.2106V11H13.2105M15.7895 11H19.4736M22.0526 11H24.2631V12.8422M24.2631 16.1581V15.0528M20.5789 22.7898C20.9698 22.7898 21.3446 22.6346 21.621 22.3582C21.8973 22.0818 22.0526 21.707 22.0526 21.3161C22.0526 20.9253 21.8973 20.5504 21.621 20.274C21.3446 19.9976 20.9698 19.8424 20.5789 19.8424C20.1881 19.8424 19.8132 19.9976 19.5369 20.274C19.2605 20.5504 19.1052 20.9253 19.1052 21.3161C19.1052 21.707 19.2605 22.0818 19.5369 22.3582C19.8132 22.6346 20.1881 22.7898 20.5789 22.7898Z"/>
                        </g>
                    </svg>
                </button>
                <button class="control-btn" id="delete-polygon-btn" title="Delete Items">
                    <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
                        <g transform="translate(12, 11.5) scale(1.82) translate(-12, -11.5)" stroke-width="1.1">
                            <path d="M16.23 12.3C16.81 11.85 16.92 11.03 16.49 10.44L14.5 7.75C14.05 7.16 13.21 7.04 12.61 7.49L8.74 10.46L12.46 15.13L13.39 14.47L16.23 12.3Z"/>
                            <path d="M12.46 15.13L11.39 16L8.45 16L7.73 15.02L6.72 13.66C6.28 13.08 6.4 12.25 6.98 11.81L8.84 10.38"/>
                            <line x1="8.48" y1="16" x2="17.21" y2="16"/>
                        </g>
                    </svg>
                </button>
                <div class="control-separator"></div>
                <button class="control-btn" id="clear-polygons-btn" title="Clear All">
                    <svg class="control-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <g transform="translate(12, 12) scale(1.32) translate(-18, -18)" stroke="#D64550" stroke-width="1.52" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23.8333 12.8L23.3511 20.82C23.2282 22.8688 23.1668 23.8936 22.6667 24.6304C22.4198 24.9945 22.1019 25.3018 21.7333 25.5328C20.989 26 19.9911 26 17.9953 26C15.9964 26 14.997 26 14.2511 25.532C13.8824 25.3006 13.5645 24.9927 13.3178 24.628C12.8184 23.8904 12.7578 22.864 12.638 20.812L12.1667 12.8M11 12.8H25M21.1547 12.8L20.6234 11.6736C20.2711 10.9248 20.0946 10.5512 19.7904 10.3176C19.7229 10.2659 19.6514 10.2198 19.5766 10.18C19.2398 10 18.8353 10 18.0272 10C17.1981 10 16.7836 10 16.4406 10.1872C16.3647 10.229 16.2924 10.2771 16.2243 10.3312C15.9171 10.5736 15.7452 10.9616 15.4014 11.7368L14.9301 12.8M16.0556 21.6V16.8M19.9444 21.6V16.8"/>
                        </g>
                    </svg>
                </button>
            </div>

            <!-- Viewer Container -->
            <div class="viewer-container" id="viewer-container">
                <div class="viewer-placeholder">
                    <div class="placeholder-content">
                        <div class="placeholder-icon">🔬</div>
                        <h2 class="placeholder-title">No Slide Loaded</h2>
                        <p class="placeholder-text">Select a slide from the sidebar to view</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast"></div>

    <!-- Scripts -->
    <script src="viewer.js"></script>
</body>

</html>
